<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · Meadowbrook Clinic</title>
<meta name="description" content="Meadowbrook Clinic: book appointments, order repeat prescriptions and see your test results online.">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/core.js" defer></script>
{{scripts}}
</head>
<body data-page="{{page}}" data-role="{{role}}">
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap header-row">
    <a class="logo" href="/"><span class="logo-mark" aria-hidden="true">M</span> Meadowbrook <span>Clinic</span></a>
    <nav class="nav" aria-label="Main">{{nav}}</nav>
    <span class="account">{{account}}</span>
  </div>
</header>
<main id="main" class="wrap">
{{content}}
</main>
<footer class="site-footer">
  <div class="wrap footer-row">
    <p><strong>Meadowbrook Clinic</strong> · Demo clinic for QA testing — not real medical advice. Everyone here is fictional.</p>
    <p><a href="/help">Help and policies</a> · In an emergency call 999</p>
  </div>
</footer>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
