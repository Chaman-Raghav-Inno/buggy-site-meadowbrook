<h1>Find a clinician</h1>
<form id="dr-filters" class="filters card" novalidate role="search">
  <div class="field grow"><label for="dr-q">Name</label><input id="dr-q" type="search" placeholder="e.g. Achebe" autocomplete="off"></div>
  <div class="field"><label for="dr-specialty">Specialty</label><select id="dr-specialty"><option value="">Any specialty</option></select></div>
</form>
<p id="dr-count" class="muted" role="status" aria-live="polite"></p>
<div id="dr-list" class="grid doctor-grid"></div>
