<div class="section-head"><h1>Appointments</h1><a class="btn" href="/book">Book an appointment</a></div>
<p id="ap-owed" class="notice" hidden></p>
<section>
  <h2>Upcoming</h2>
  <div class="table-wrap">
    <table class="table ap-table" aria-label="Upcoming appointments">
      <thead><tr><th>Day</th><th>Time</th><th>With</th><th>For</th><th>Status</th><th></th></tr></thead>
      <tbody id="ap-upcoming"><tr><td colspan="6" class="muted">Loading…</td></tr></tbody>
    </table>
  </div>
  <p id="ap-msg" class="msg" role="status"></p>
</section>
<section class="section">
  <h2>Past</h2>
  <div class="table-wrap">
    <table class="table ap-table" aria-label="Past appointments">
      <thead><tr><th>Day</th><th>Time</th><th>With</th><th>For</th><th>Status</th></tr></thead>
      <tbody id="ap-past"></tbody>
    </table>
  </div>
</section>
<dialog id="ap-cancel" aria-labelledby="ap-cancel-title">
  <h2 id="ap-cancel-title">Cancel this appointment?</h2>
  <p id="ap-cancel-text"></p>
  <p id="ap-cancel-fee" class="muted small"></p>
  <div class="dialog-actions">
    <button type="button" class="btn btn-ghost" data-value="keep">Keep it</button>
    <button type="button" class="btn btn-danger" data-value="cancel">Cancel appointment</button>
  </div>
</dialog>
<dialog id="ap-move" aria-labelledby="ap-move-title">
  <form id="ap-move-form" novalidate>
    <h2 id="ap-move-title">Move this appointment</h2>
    <p id="ap-move-what" class="muted"></p>
    <div class="field-row">
      <div class="field"><label for="ap-move-date">New day</label><input id="ap-move-date" type="date"></div>
      <div class="field"><label for="ap-move-time">New time</label><select id="ap-move-time"></select></div>
    </div>
    <p id="ap-move-msg" class="msg" role="status"></p>
    <div class="dialog-actions">
      <button type="button" class="btn btn-ghost" id="ap-move-back">Back</button>
      <button type="submit" class="btn">Move appointment</button>
    </div>
  </form>
</dialog>
